<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiador de Temas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">

        <h1>Temas</h1>
        <p class="subtitle">Selecciona un tema para cambiar la apariencia</p>

        <!-- Opciones de temas -->
        <div class="theme-selector">

            <input type="radio" name="theme" id="light" checked>
            <label for="light">Color claro</label>

            <input type="radio" name="theme" id="dark">
            <label for="dark">Obscuro</label>

            <input type="radio" name="theme" id="custom">
            <label for="custom">Personalizado</label>

        </div>

        <!-- Tarjeta de vista previa -->
        <div class="card">

            <h2>Hola mundo!</h2>

            <p>
                Esta es una tarjeta con 
                temas diferentes.
            </p>

            <button type="button">Primary Button</button>

        </div>

    </div>

</body>
</html>
